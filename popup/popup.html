<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vosk STT</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg></div>
      <div>
        <h1>Vosk STT</h1>
        <p class="subtitle">Voice → Text</p>
      </div>
    </div>

    <!-- Language selection (hidden when Quick Switch is on) -->
    <div class="lang-row" id="langRow"></div>

    <!-- Actions -->
    <div class="actions">
      <button id="toggleBtn" class="main-btn">Show Mic Button</button>
      <button id="pickBtn" class="pick-btn">Pick Input Field</button>
    </div>

    <!-- Settings group -->
    <div class="settings-group">

      <!-- Engine Mode Toggle -->
      <div class="engine-mode-row">
        <span class="engine-label">Engine</span>
        <div class="engine-toggle" id="engineToggle">
          <button class="engine-btn active" data-mode="online">Online</button>
          <button class="engine-btn" data-mode="auto">Auto</button>
          <button class="engine-btn" data-mode="offline">Local</button>
        </div>
      </div>

      <!-- Local Server Config (shown only when local mode) -->
      <div class="model-config hidden" id="modelConfig">
        <div class="model-info">
          <span class="model-label">Local Server</span>
          <span class="model-status" id="modelStatus">⏳ Checking...</span>
        </div>
        <div class="model-actions">
          <a class="model-link" href="https://github.com/crrrowz/Vosk-STT-Chrome-Extension/tree/main/server"
            target="_blank" rel="noopener">Server Setup Guide ↗</a>
        </div>
      </div>

      <div class="toggle-row">
        <label class="toggle-label" for="splitToggle">Quick Switch</label>
        <label class="switch">
          <input type="checkbox" id="splitToggle">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Split language pair picker -->
      <div class="split-picker" id="splitPicker">
        <div class="split-picker-row">
          <select id="splitLang1" class="split-select"></select>
          <span class="split-swap" id="splitSwap" title="Swap">⇄</span>
          <select id="splitLang2" class="split-select"></select>
        </div>
      </div>

      <div class="toggle-row">
        <label class="toggle-label" for="autoShowToggle">Auto-show Mic</label>
        <label class="switch">
          <input type="checkbox" id="autoShowToggle" checked>
          <span class="slider"></span>
        </label>
      </div>


      <div class="delay-row">
        <div class="delay-header">
          <label class="delay-label">Insert Delay</label>
          <span id="delayValue" class="delay-value">0s</span>
        </div>
        <input type="range" id="insertDelay" min="0" max="5000" step="250" value="0" class="delay-slider">
      </div>
    </div>

    <!-- Shortcuts -->
    <div class="shortcuts">
      <div class="shortcut-row"><kbd>Alt+S</kbd><span>Record</span></div>
      <div class="shortcut-row"><kbd>Alt+L</kbd><span>Lang</span></div>
      <div class="shortcut-row"><kbd>Alt+P</kbd><span>Pick</span></div>
    </div>
  </div>

  <script src="../scripts/languages.js"></script>
  <script src="popup.js"></script>
</body>

</html>
